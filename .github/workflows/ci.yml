name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and checks
        run: python -m pip install --upgrade pip && python -m pip install -e . ruff mypy pytest
      - name: Check optional extension JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check browser_extension/popup.js
      - name: Test browser helper behavior
        run: node --test tests/agent_autofill/login_fields.test.cjs tests/agent_autofill/popup.test.cjs
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Test
        run: pytest -q
      - name: Ruff
        run: ruff check agent_autofill tests
      - name: Type check
        run: mypy agent_autofill
      - name: Compile
        run: python -m compileall -q agent_autofill tests
