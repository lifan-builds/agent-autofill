[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-autofill"
version = "0.1.0"
description = "Local-first personal information broker for AI agents"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
  "keyring>=25",
]

[project.scripts]
agent-autofill = "agent_autofill.cli:main"
agent-autofill-server = "agent_autofill.server:main"

[tool.setuptools.packages.find]
include = ["agent_autofill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
