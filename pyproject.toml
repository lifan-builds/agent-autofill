[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palisade-agent"
version = "0.1.0"
description = "Local-first personal information broker for AI agents"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
  "keyring>=25",
]

[project.scripts]
palisade = "palisade.cli:main"
palisade-server = "palisade.server:main"

[tool.setuptools.packages.find]
include = ["palisade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
