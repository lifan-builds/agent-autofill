<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Agent Autofill information flow</title>
  <desc id="desc">Local sources feed an encrypted vault. An authenticated agent receives either selected fields directly or a one-time extension handle.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7f9ff"/><stop offset="1" stop-color="#eef7f5"/></linearGradient>
    <linearGradient id="vault" x1="0" x2="1"><stop stop-color="#4f46e5"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="54" y="58" font-size="25" font-weight="700" fill="#172033">Remember once. Reuse safely. Keep control.</text>
    <text x="54" y="86" font-size="15" fill="#536176">A local-first information path with two explicit delivery choices.</text>
    <g filter="url(#shadow)">
      <rect x="54" y="135" width="230" height="210" rx="20" fill="#fff"/>
      <rect x="350" y="110" width="300" height="260" rx="24" fill="url(#vault)"/>
      <rect x="716" y="135" width="430" height="210" rx="20" fill="#fff"/>
    </g>
    <g fill="#172033">
      <text x="82" y="177" font-size="18" font-weight="700">Local sources</text>
      <text x="82" y="211" font-size="14">Profile &amp; addresses</text><text x="82" y="239" font-size="14">Read-only email</text><text x="82" y="267" font-size="14">Website credentials</text><text x="82" y="295" font-size="14">Financial metadata</text>
      <text x="82" y="326" font-size="12" fill="#64748b">Values stay on this machine.</text>
      <text x="386" y="165" font-size="19" font-weight="700" fill="#fff">Encrypted local vault</text>
      <text x="386" y="198" font-size="14" fill="#e0e7ff">Scopes · provenance · one-time reads</text>
      <text x="386" y="235" font-size="14" fill="#fff">OS credential store</text><text x="386" y="265" font-size="14" fill="#fff">Authenticated broker</text><text x="386" y="295" font-size="14" fill="#fff">Value-free dashboard</text><text x="386" y="337" font-size="12" fill="#dbeafe">Local-only by default</text>
      <text x="744" y="177" font-size="18" font-weight="700">Authenticated agent</text>
      <text x="744" y="210" font-size="14">Choose one delivery mode per task:</text>
    </g>
    <g>
      <rect x="744" y="230" width="175" height="84" rx="14" fill="#eef2ff" stroke="#c7d2fe"/><text x="763" y="258" font-size="14" font-weight="700" fill="#3730a3">Direct fields</text><text x="763" y="282" font-size="12" fill="#475569">Selected values reach</text><text x="763" y="300" font-size="12" fill="#475569">the acting agent.</text>
      <rect x="941" y="230" width="175" height="84" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/><text x="960" y="258" font-size="14" font-weight="700" fill="#047857">Optional extension</text><text x="960" y="282" font-size="12" fill="#475569">One-time handle;</text><text x="960" y="300" font-size="12" fill="#475569">password stays local.</text>
    </g>
    <path d="M286 240h54" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M652 240h54" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="54" y="400" font-size="13" fill="#536176">Agent Autofill prepares information. The acting agent owns navigation, submission, and post-action verification.</text>
  </g>
</svg>
